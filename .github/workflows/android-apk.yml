name: Build BPM Android APK

on:
  push:
    branches: [android-apk]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Generate full-bleed adaptive launcher icons
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Image.open("icon-512.png").convert("RGBA")
          pixels = source.load()
          xs, ys = [], []
          for y in range(source.height):
              for x in range(source.width):
                  r, g, b, a = pixels[x, y]
                  if a > 0 and max(r, g, b) < 75:
                      xs.append(x)
                      ys.append(y)
          if not xs:
              raise SystemExit("Could not locate the dark BPM logo tile in icon-512.png")
          pad = 3
          box = (max(0, min(xs)-pad), max(0, min(ys)-pad),
                 min(source.width, max(xs)+pad+1), min(source.height, max(ys)+pad+1))
          tile = source.crop(box)
          side = max(tile.size)
          square = Image.new("RGBA", (side, side), (12, 10, 10, 255))
          square.alpha_composite(tile, ((side-tile.width)//2, (side-tile.height)//2))
          # Use the cropped BPM tile as the adaptive foreground. Matching black
          # adaptive background makes Android's safe-zone scaling invisible.
          drawable = Path("app/src/main/res/drawable-nodpi")
          drawable.mkdir(parents=True, exist_ok=True)
          square.save(drawable / "ic_launcher_foreground.png", optimize=True)
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          for folder, size in sizes.items():
              out = Path("app/src/main/res") / folder
              out.mkdir(parents=True, exist_ok=True)
              square.resize((size, size), Image.Resampling.LANCZOS).save(out / "ic_launcher.png", optimize=True)
          print("Generated legacy and adaptive BPM launcher artwork.")
          PY
          mkdir -p app/src/main/res/mipmap-anydpi-v26 app/src/main/res/values
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          XML
          cat > app/src/main/res/values/ic_launcher_background.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#0C0A0A</color>
          </resources>
          XML
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BPM-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

# Rebuild after adaptive launcher icon update.
